<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双镜片批注本 · 白洞</title>
<style>
  :root{
    --paper:#FBFAF7;
    --ink:#1A1815;
    --ink-2:#2C2823;
    --muted:#6B635C;
    --faint:#8F877E;
    --line:#E2DCD3;
    --line-2:#CFC7BB;
    --vermilion:#B23A2E;
    --vermilion-soft:#F3E5E1;
    --mark:#6B635C;
    --good:#2E6B4F;
    --warn:#8A5A0B;

    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","STSong",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",-apple-system,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:17px;
    line-height:1.95;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--vermilion-soft);color:var(--ink)}

  .wrap{max-width:1080px;margin:0 auto;padding:0 40px 120px}

  /* ── 报告头 ───────────────────────────────── */
  .masthead{padding:64px 0 0}
  .eyebrow{
    font-family:var(--sans);font-size:10.5px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  }
  .masthead h1{
    font-family:var(--serif);font-size:clamp(27px,3.6vw,39px);font-weight:700;
    line-height:1.32;letter-spacing:-.01em;margin:14px 0 0;color:var(--ink);
  }
  .masthead h1 em{font-style:normal;color:var(--vermilion)}
  /* 全角冒号的墨迹落在字身左半，标题里看起来像多了一个空格；收紧一点 */
  .masthead h1 .c{margin-right:-.26em}
  .byline{
    font-family:var(--sans);font-size:12.5px;color:var(--muted);
    margin-top:14px;display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;
  }
  .byline span{white-space:nowrap}
  .byline i{font-style:normal;color:var(--line-2)}

  /* 输入条：说明这份报告处理的是哪段文本 */
  .inputbar{
    margin-top:26px;border:1px solid var(--line);border-radius:3px;
    background:#FFFDF9;padding:14px 18px;
    font-family:var(--sans);font-size:12.5px;line-height:1.7;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  }
  .inputbar b{
    font-weight:600;color:var(--ink);font-family:var(--serif);font-size:14px;
  }
  .inputbar .k{color:var(--faint);letter-spacing:.04em}

  /* ── 模式切换 ─────────────────────────────── */
  .modeswitch{
    position:sticky;top:0;z-index:20;
    margin:32px 0 0;padding:14px 0 13px;
    background:var(--paper);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  /* 只在色块下方留一道渐隐，不把整条的底色做成半透明（否则下面的正文会透上来） */
  .modeswitch::after{
    content:"";position:absolute;left:0;right:0;top:100%;height:16px;
    background:linear-gradient(rgba(251,250,247,.92),rgba(251,250,247,0));
    pointer-events:none;
  }
  /* ── 封面：先选改法 ───────────────────────── */
  .cover{padding:72px 0 40px;max-width:820px}
  .cover-h1{
    font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);font-weight:700;
    line-height:1.34;letter-spacing:-.01em;margin:16px 0 0;
  }
  .cover-h1 em{font-style:normal;color:var(--vermilion)}
  .quote{
    margin:34px 0 0;padding:22px 24px;background:var(--paper-2);
    border-left:2px solid var(--line-2);
  }
  .quote-k{
    font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint);margin-bottom:10px;
  }
  .quote p{
    margin:0;font-family:var(--serif);font-size:17px;line-height:1.95;color:var(--ink-2);
  }
  .quote .gap{color:var(--faint);padding:0 .35em;letter-spacing:.2em}
  .quote p span{display:inline}
  .quote-m{
    margin-top:12px;font-family:var(--sans);font-size:12px;color:var(--muted);
  }
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:26px 0 0}
  .pick button{
    appearance:none;text-align:left;cursor:pointer;
    background:var(--paper);border:1px solid var(--line-2);border-radius:4px;
    padding:20px 22px 18px;transition:border-color .16s,background .16s,transform .16s;
  }
  .pick button:hover{background:#FFFDF9;border-color:var(--vermilion);transform:translateY(-1px)}
  .pick button:focus-visible{outline:2px solid var(--vermilion);outline-offset:2px}
  .pick .pk{
    display:flex;align-items:baseline;gap:10px;
    font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);
  }
  .pick .pk i{
    font-family:var(--sans);font-style:normal;font-size:10.5px;font-weight:700;
    letter-spacing:.1em;color:var(--faint);
  }
  .pick .pd{
    margin-top:9px;font-family:var(--sans);font-size:12.5px;line-height:1.75;color:var(--muted);
  }
  .pick .pm{
    margin-top:12px;font-family:var(--sans);font-size:11.5px;color:var(--faint);
    display:flex;gap:12px;flex-wrap:wrap;
  }
  .pick .pm b{color:var(--vermilion);font-weight:700}
  .cover-foot{
    margin-top:22px;font-family:var(--sans);font-size:12px;line-height:1.7;color:var(--faint);
  }
  .again{
    appearance:none;border:1px solid var(--line-2);background:transparent;border-radius:3px;
    font-family:var(--sans);font-size:12px;color:var(--muted);cursor:pointer;
    padding:6px 12px;margin-left:auto;transition:border-color .15s,color .15s;
  }
  .again:hover{border-color:var(--vermilion);color:var(--vermilion)}
  .again:focus-visible{outline:2px solid var(--vermilion);outline-offset:2px}

  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
  .seg button{
    appearance:none;border:0;background:#FFFDF9;color:var(--muted);
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;
    padding:9px 20px;cursor:pointer;transition:background .15s,color .15s;
  }
  .seg button + button{border-left:1px solid var(--line-2)}
  .seg button:hover{background:#F6F2EA;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--vermilion);color:#FFF8F5}
  .seg button:focus-visible{outline:2px solid var(--vermilion);outline-offset:-3px}
  .switchhint{font-family:var(--sans);font-size:12px;color:var(--faint)}

  /* ── 判定 ─────────────────────────────────── */
  .verdict{margin:34px 0 0;padding:0 0 0 22px;border-left:2px solid var(--vermilion)}
  .verdict p{
    margin:0;font-size:19.5px;line-height:1.85;color:var(--ink);letter-spacing:-.004em;
  }
  .verdict p + p{
    margin-top:12px;font-size:16px;line-height:1.9;color:var(--ink-2);
  }
  .verdict strong{
    font-weight:700;font-style:italic;color:var(--ink);
    background:linear-gradient(transparent 66%,var(--vermilion-soft) 66%);
  }

  /* ── 指标行 ───────────────────────────────── */
  .stats{
    margin:38px 0 0;display:grid;grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);
  }
  .stat{padding:20px 18px 18px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:0;padding-left:0}
  .stat .lab{
    font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);
  }
  .stat .val{
    font-family:var(--sans);font-size:26px;font-weight:600;color:var(--ink);
    margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;
  }
  .stat .val s{
    text-decoration:none;color:var(--faint);font-size:15px;font-weight:400;
    margin-right:7px;letter-spacing:0;
  }
  .stat .val .arw{color:var(--line-2);margin:0 5px;font-size:16px}
  .stat .foot{
    font-family:var(--sans);font-size:11.5px;margin-top:6px;
    color:var(--good);font-variant-numeric:tabular-nums;
  }
  .stat .foot.flat{color:var(--faint)}
  .stat .foot.bad{color:var(--warn)}

  /* ── 节标题 ───────────────────────────────── */
  .sec{margin:76px 0 0}
  .sec-head{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
  .sec-no{
    font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.1em;
    color:var(--vermilion);font-variant-numeric:tabular-nums;
  }
  .sec-head h2{
    font-family:var(--serif);font-size:21px;font-weight:700;margin:0;
    letter-spacing:-.004em;color:var(--ink);
  }
  .sec-head .sub{
    font-family:var(--sans);font-size:12px;color:var(--faint);margin-left:auto;
    text-align:right;line-height:1.6;
  }
  .sec-note{
    font-family:var(--sans);font-size:12.5px;line-height:1.75;color:var(--muted);
    margin:16px 0 0;max-width:62ch;
  }
  .sec-note code{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;
    background:#F2EDE4;padding:1px 5px;border-radius:2px;
  }

  /* ── 批注：左正文 右页边注 ─────────────────── */
  .annot{border-bottom:1px solid var(--line)}
  .annot:last-of-type{border-bottom:0}
  .row{
    display:grid;grid-template-columns:minmax(0,1fr) 254px;gap:44px;
    padding:30px 0;align-items:start;
  }
  .row + .row{border-top:1px solid var(--line)}
  .row .body{min-width:0}
  .row .body p{margin:0;color:var(--ink-2);font-size:17px;line-height:2.0}
  .row .body p + p{margin-top:14px}
  .row.clean .body p{color:var(--muted)}

  /* 页边注 */
  .marg{font-family:var(--sans);font-size:12.5px;line-height:1.72;color:var(--muted)}
  .marg .pno{
    font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--faint);
    display:block;margin-bottom:10px;text-transform:uppercase;
  }
  .note{display:grid;grid-template-columns:1.55em 1fr;gap:8px;margin-bottom:15px}
  .note:last-child{margin-bottom:0}
  .note .n{
    font-family:var(--sans);font-size:12px;font-weight:700;color:var(--vermilion);
    font-variant-numeric:tabular-nums;line-height:1.72;
  }
  .note .t{min-width:0}
  .note .t .tag{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
    color:var(--vermilion);margin-right:6px;vertical-align:1px;
  }
  .note .t .tag.hard{color:var(--warn)}
  .marg .none{color:var(--faint);font-size:12px;font-style:italic}

  /* 标注本身：灰 / 粗 / 斜，加一记浅朱红下划线 */
  mark{
    background:none;color:var(--mark);font-weight:700;font-style:italic;
    border-bottom:1px dotted rgba(178,58,46,.5);padding-bottom:.5px;
    cursor:default;transition:background .15s;
  }
  mark:hover,mark.lit{background:rgba(178,58,46,.075)}
  sup.n{
    font-family:var(--sans);font-size:10px;font-weight:700;color:var(--vermilion);
    vertical-align:super;line-height:0;margin-left:2px;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
  .note.hit{background:rgba(178,58,46,.06)}
  .note.hit .n{color:#8E2A20}

  /* ── 改写版 ───────────────────────────────── */
  .rw .row{padding:26px 0}
  .rw .body p{font-size:17.5px;line-height:2.05;color:var(--ink)}
  /* 列头只出现一次；每段再挂一个「为什么这样写」就是八次重复噪音 */
  .rw-head{
    display:grid;grid-template-columns:minmax(0,1fr) 254px;gap:44px;
    padding-bottom:11px;border-bottom:1px solid var(--line-2);
    font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:var(--faint);
  }
  .rw-head span:last-child{color:var(--vermilion)}
  .rw .marg ul{margin:0;padding:0;list-style:none}
  .rw .marg li{position:relative;padding-left:12px;margin-bottom:9px}
  .rw .marg li:last-child{margin-bottom:0}
  .rw .marg li::before{
    content:"";position:absolute;left:0;top:.72em;width:4px;height:1px;background:var(--line-2);
  }

  /* ── 内容总结 ─────────────────────────────── */
  .sumlist{list-style:none;margin:26px 0 0;padding:0;counter-reset:s}
  .sumlist li{
    counter-increment:s;position:relative;padding:16px 0 16px 46px;
    border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.9;color:var(--ink-2);
  }
  .sumlist li:last-child{border-bottom:0}
  .sumlist li::before{
    content:counter(s,decimal-leading-zero);position:absolute;left:0;top:16px;
    font-family:var(--sans);font-size:11px;font-weight:700;color:var(--vermilion);
    letter-spacing:.06em;font-variant-numeric:tabular-nums;
  }

  /* ── 事实核对 ─────────────────────────────── */
  table.facts{width:100%;border-collapse:collapse;margin:24px 0 0;font-family:var(--sans);font-size:13.5px}
  table.facts th{
    text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);padding:0 14px 10px 0;border-bottom:1px solid var(--line-2);
  }
  table.facts td{
    padding:14px 14px 14px 0;border-bottom:1px solid var(--line);
    vertical-align:top;line-height:1.7;color:var(--ink-2);
  }
  table.facts td:first-child{font-family:var(--serif);font-size:15px;color:var(--ink);width:34%}
  table.facts td.v{width:118px;font-weight:700;font-size:12.5px;white-space:nowrap;letter-spacing:.02em}
  table.facts td.v.bad{color:var(--vermilion)}
  table.facts td.v.mid{color:var(--warn)}
  table.facts td.v.ok{color:var(--good)}
  table.facts td:last-child{color:var(--muted);font-size:12.5px}

  /* ── 学习建议 ─────────────────────────────── */
  .adv{margin:26px 0 0;counter-reset:a}
  .adv .item{
    counter-increment:a;display:grid;grid-template-columns:52px minmax(0,1fr);gap:22px;
    padding:26px 0;border-bottom:1px solid var(--line);
  }
  .adv .item:last-child{border-bottom:0}
  .adv .item::before{
    content:counter(a,decimal-leading-zero);
    font-family:var(--sans);font-size:11px;font-weight:700;color:var(--vermilion);
    letter-spacing:.06em;padding-top:7px;font-variant-numeric:tabular-nums;
  }
  .adv h3{
    font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 9px;
    line-height:1.6;color:var(--ink);
  }
  .adv p{margin:0;font-size:16px;line-height:1.92;color:var(--ink-2)}
  .adv p + p{margin-top:9px}
  .adv .check{
    font-family:var(--sans);font-size:13px;line-height:1.75;color:var(--muted);
    margin-top:10px;padding:11px 14px;background:#F6F1E8;border-radius:2px;
    border-left:2px solid var(--line-2);
  }
  .adv .check b{color:var(--vermilion);font-weight:600}

  /* ── 尾 ───────────────────────────────────── */
  .colophon{
    margin-top:80px;padding-top:22px;border-top:1px solid var(--line-2);
    font-family:var(--sans);font-size:11.5px;line-height:1.8;color:var(--faint);
    display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }

  .hidden{display:none !important}

  /* ── 响应式 ───────────────────────────────── */
  @media (max-width:900px){
    .wrap{padding:0 22px 80px}
    .row{grid-template-columns:1fr;gap:0}
    .marg{
      margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
    }
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat:nth-child(3){border-left:0;padding-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .sec-head{flex-wrap:wrap;gap:8px 14px}
    .sec-head .sub{margin-left:0;text-align:left;width:100%}
    .adv .item{grid-template-columns:34px minmax(0,1fr);gap:14px}
    .cover{padding:44px 0 30px}
    .pick{grid-template-columns:1fr;gap:12px}
  }
  @media (max-width:520px){
    body{font-size:16px;line-height:1.9}
    .row .body p,.rw .body p{font-size:16.5px;line-height:1.95}
    .verdict p{font-size:17.5px}
    .stats{grid-template-columns:1fr}
    .stat{border-left:0;padding-left:0}
    .stat + .stat{border-top:1px solid var(--line)}
    /* 窄屏不能藏「判定」列——那是整张表唯一有结论的一列。改成每条一叠。 */
    table.facts{font-size:13px}
    table.facts thead{display:none}
    table.facts,table.facts tbody{display:block}
    table.facts tbody tr{display:block;padding:16px 0;border-bottom:1px solid var(--line)}
    table.facts td{
      display:block;width:auto !important;border:0;padding:0;white-space:normal;
    }
    table.facts td:first-child{font-size:15.5px;margin-bottom:7px}
    table.facts td.v{margin-bottom:7px;font-size:12px}
    table.facts td:last-child{font-size:12.5px;line-height:1.75}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }

  @media print{
    .modeswitch{display:none}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .sec{break-inside:avoid}
    .row{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ① 先看文本，再决定改法。改法在「文本放进来」这一步就选定，不是看完两份再挑。 -->
  <section class="cover" id="cover">
    <div class="eyebrow">双镜片批注本 · Annotated Edition</div>
    <h1 class="cover-h1">这段文本，<em>你要哪一种改法</em>？</h1>

    <div class="quote" id="quote">
      <div class="quote-k"><span id="qtag">输入</span></div>
      <p id="qtext"></p>
      <div class="quote-m" id="qmeta"></div>
    </div>

    <div class="pick" id="pick"></div>
    <div class="cover-foot">选完直接出报告。两种改法是两份独立的稿子，不是同一份稿子的两个视图。</div>
  </section>

  <!-- ② 报告 -->
  <div id="doc" hidden>
    <header class="masthead">
      <div class="eyebrow">双镜片批注本 · Annotated Edition</div>
      <h1 id="h1"></h1>
      <div class="byline" id="byline"></div>
      <div class="inputbar" id="inputbar"></div>
    </header>

    <div class="modeswitch">
      <span class="switchhint" id="switchhint"></span>
      <button class="again" id="again" type="button">换一种改法</button>
    </div>

    <main id="main"></main>

    <footer class="colophon">
      <span id="colophon-l"></span>
      <span id="colophon-r"></span>
    </footer>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   内容载荷。两种模式是两份独立的报告，都针对同一段原文；
   所有判断、注解、改写均由模型撰写，指标由引擎实测后写回。
   ════════════════════════════════════════════════════════════ */
const SRC = {
  chars: 1445,
  excerpt: '今天，带你走进能让人死而复生的天体，白洞。',
  paras: 10
};

const DATA = {
  rig: {
    key: 'rig',
    label: '严谨化',
    title: '白洞<span class="c">：</span><em>方程允许</em>，不等于宇宙允许',
    byline: ['原文 1,445 字', '10 段', '10 处批注', '改写 721 字', '断言强度 27.1 → 0.0'],
    hint: '这份报告只做一件事：把每句话退回到它证据能支撑的位置，同时不把它写成免责声明。',

    verdict: [
      '这段文字的事实骨架大体成立，但它把<strong>「理论上允许」讲成了「已经发生」</strong>，把「没有观测证据」讲成了「科学家终于意识到」。真正塌掉的不是知识点，是断言的强度。',

      { paras: ['第二个麻烦是热力学第二定律。宇宙大体上只让熵增加，白洞干的是反方向，把散开的重新聚起来。这是不是真违反第二定律，文献里两种说法都有。所以「物理界认为白洞不该存在」这句话说重了，更准确的说法是：它一直没能通过稳定性这一关。'],

    advice: [
      { h: '「不是 X，而是 Y」这个句式，几乎总在抬高断言',
        p: '它的功能是取消对方的资格，而不是给出新证据。原文用它写了三处：「这不是科幻，而是……宇宙法则」「不是它藏得深，而是它一出现就会杀死自己」「从来不是救赎，而是最残酷的惩罚」。三处都没有伴随新的证据，只有语气变强。',
        c: '把 X 删掉，看剩下的句子还成不成立。成立，说明 X 只是被立起来打的靶子；不成立，说明这个对比承担了论证，那就得补证据。' },
      { h: '「科学家终于意识到」是中文科普最顺手的权威转移',
        p: '中文里的「科学家 / 专家 / 研究表明 / 学界普遍认为」可以不带出处地出现，因为它们读起来像一个机构名。原文靠这一句把「有人提出」升级成了「共识成立」。英文的 scientists have come to realize 同样可疑，但中文句式更短，因此更容易滑过去。',
        c: '给每个这类主语补一句「谁、哪年、哪篇」。补不出来就删掉主语，改写成「有人提出」「一种解释是」——损失很小，可信度差别很大。' },
      { h: '数量词一旦用「等于」，中文读者会自动把它当成事实',
        p: '「0.1 秒等于 1000 亿年」的问题不在数字，在「等于」这个词。中文的「等于」比英文 equals 更硬，它暗示存在一个换算关系。实际物理里只有 r/rₛ 的函数，没有一个通用数值。',
        c: '凡是「等于 / 相当于 / 换算成」，后面必须跟一句「相对于……」或「在……条件下」。跟不出来的，就不是换算，是比喻。' },
      { h: '汉字自带价值判断，物理名词一配上道德动词就变成叙事',
        p: '「铁律」「逆天」「抹杀」「恐怖」「疯狂」——这些词在中文里天然带道德色彩。它们贴在「热力学第二定律」「对称体」上，物理描述就变成了善恶叙事。原文的「叛逆者 / 乖乖听话的清道夫」是这个过程的完成形态：它给了两个天体各一个道德身份。',
        c: '把形容词和比喻全删掉读一遍。若意思没变，那些词就不是信息，是叙事。叙事可以留，但要知道自己在写叙事。' },
      { h: '让步从句的位置，暴露了作者想让读者记住哪一半',
        p: '中文习惯「虽然 A，但是 B」，重点永远落在 B。原文有一处写对了：「理论上都会……吐出来」；但更多地方把限定写在前面、断言写在后面，读者只带走后面那半句。这是句法层面的偏差，不是作者不诚实。',
        c: '把限定改成一个独立短句，放在断言之后。短句比长定语更抗遗忘 —— 「它必须有前提：经典图像，不算量子效应」比「在忽略量子效应的经典框架下」有效得多。' },
      { h: '一个通用动作：给每句话补出「谁说的、凭什么」',
        p: '严谨化不是给句子加限定词，而是给每个断言找到它的持有者。原文里每一句都能补出来源，只是作者选了不补；不补的句子读起来更像宇宙自己说的话，而不是某个人算出来的结论。这个区别，就是科普和论文的分界。',
        c: '逐句问两个问题：这是谁说的？他凭什么这么说？两句都答得出来，这句可以不留限定；答不出来，就加限定或者删掉。' }
    ],

/* ════════════════ 渲染 ════════════════ */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** 页边注：number + tag + text */
function noteHTML(n) {
  return `<div class="note" data-for="${n.n}">
    <span class="n">${n.n}</span>
    <span class="t"><span class="tag">${esc(n.tag)}</span>${esc(n.text)}</span>
  </div>`;
}

/** 原文批注区。没有注解的段落照样列出，页边注位说明它没问题。 */
function annotHTML(d) {
  // 给每个标注补一个上标编号，正文与页边注才能一眼配对。
  const withSup = (html) =>
    html.replace(
      /<mark data-n="(\d+)">([\s\S]*?)<\/mark>/g,
      (whole, n) => `${whole}<sup class="n">${n}</sup>`,
    );

  const rows = ORIG[d.key].map((html, idx) => {
    const a = d.annots.find((x) => x.i === idx + 1) || { notes: [] };
    const clean = a.notes.length === 0;
    const marg = clean
      ? '<span class="none">这一段没有问题</span>'
      : a.notes.map(noteHTML).join('');
    return `<div class="row${clean ? ' clean' : ''}">
      <div class="body"><p>${withSup(html)}</p></div>
      <div class="marg"><span class="pno">段落 ${idx + 1}</span>${marg}</div>
    </div>`;
  });
  return `<div class="annot">${rows.join('')}</div>`;
}

function rewriteHTML(d) {
  const head = `<div class="rw-head"><span>改写版 · 可直接读</span><span>为什么这样写</span></div>`;
  const rows = d.rewrite.map((r) => `<div class="row">
      <div class="body">${r.paras.map((p) => `<p>${esc(p)}</p>`).join('')}</div>
      <div class="marg">
        <ul>${r.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
      </div>
    </div>`);
  return `<div class="rw">${head}${rows.join('')}</div>`;
}

function statsHTML(d) {
  return `<div class="stats">${d.stats
    .map(
      (s) => `<div class="stat">
      <div class="lab">${esc(s.lab)}</div>
      <div class="val"><s>${esc(s.before)}</s><span class="arw">→</span>${esc(s.after)}</div>
      <div class="foot ${s.dir === 'good' ? '' : s.dir === 'bad' ? 'bad' : 'flat'}">${esc(s.note)}</div>
    </div>`,
    )
    .join('')}</div>`;
}

function factsHTML(d) {
  if (!d.facts) return '';
  const rows = d.facts
    .map(
      (f) => `<tr>
      <td>${esc(f.claim)}</td>
      <td class="v ${f.kind}">${esc(f.v)}</td>
      <td>${esc(f.basis)}</td>
    </tr>`,
    )
    .join('');
  return `<section class="sec">
    <div class="sec-head"><span class="sec-no">${d._no.facts}</span><h2>事实与数据核对</h2>
      <div class="sub">说法 · 判定 · 依据</div></div>
    <div class="sec-note">这一节只核对能被文献判定的部分。判定为「争议 / 推测」的，不是错，是还没定。</div>
    <table class="facts"><thead><tr><th>原文说法</th><th>判定</th><th>依据</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </section>`;
}

function adviceHTML(d) {
  const items = d.advice
    .map(
      (a) => `<div class="item">
      <div><h3>${esc(a.h)}</h3><p>${esc(a.p)}</p><div class="check"><b>怎么查：</b>${esc(a.c)}</div></div>
    </div>`,
    )
    .join('');
  return `<section class="sec">
    <div class="sec-head"><span class="sec-no">${d._no.advice}</span><h2>中文表达学习建议</h2>
      <div class="sub">${d.key === 'rig' ? '为什么中文科普容易把话说满' : '为什么中文学术句难读，以及怎么拆'}</div></div>
    <div class="sec-note">每条都给一个可以当场做的动作，不是提醒「要注意」。</div>
    <div class="adv">${items}</div>
  </section>`;
}

function summaryHTML(d) {
  return `<section class="sec">
    <div class="sec-head"><span class="sec-no">${d._no.summary}</span><h2>内容总结</h2>
      <div class="sub">它到底在说什么</div></div>
    <ol class="sumlist">${d.summary.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
  </section>`;
}

function build(d) {
  // 节号按「实际渲染出来的区块」顺序分配，缺块不留空号。
  d._no = {};
  let n = 0;
  const pad = () => String(n++).padStart(2, '0');
  d._no.annot = pad();
  d._no.rewrite = pad();
  d._no.summary = pad();
  if (d.facts) d._no.facts = pad();
  d._no.advice = pad();

  return `<article data-mode="${d.key}">
    <div class="verdict">${d.verdict.map((v) => `<p>${v}</p>`).join('')}</div>
    ${statsHTML(d)}

    <section class="sec">
      <div class="sec-head"><span class="sec-no">${d._no.annot}</span><h2>原文批注</h2>
        <div class="sub">灰色粗体斜体 = 有问题的地方 · 上标编号对应右侧原因</div></div>
      ${annotHTML(d)}
    </section>

    <section class="sec">
      <div class="sec-head"><span class="sec-no">${d._no.rewrite}</span><h2>改写版</h2>
        <div class="sub">${d.key === 'rig' ? '严格到它的证据能支撑为止' : '删掉重复，机制往前站'}</div></div>
      ${rewriteHTML(d)}
    </section>

    ${summaryHTML(d)}
    ${factsHTML(d)}
    ${adviceHTML(d)}
  </article>`;
}

/* ════════════════ 交互 ════════════════ */

const MODES = ['rig', 'pop'];
let current = 'rig';

function paint(key) {
  current = key;
  const d = DATA[key];

  document.getElementById('h1').innerHTML = d.title;
  document.getElementById('switchhint').textContent = d.hint;
  document.getElementById('colophon-l').textContent = d.colophon;
  document.getElementById('colophon-r').textContent = '双镜片批注本 · 1 份原文 / 2 种修法';

  document.getElementById('byline').innerHTML = d.byline
    .map((b, i) => (i ? '<i>·</i>' : '') + `<span>${esc(b)}</span>`)
    .join('');

  document.getElementById('inputbar').innerHTML =
    `<span class="k">输入</span><b>${esc(SRC.excerpt)}</b>` +
    `<span class="k">${SRC.paras} 段 · ${SRC.chars.toLocaleString()} 字</span>` +
    `<span class="k">本次修法</span><span style="color:var(--vermilion);font-weight:600">${esc(d.label)}</span>`;

  // 一次只渲染一种改法：两种改法是两份独立稿件，不是同一份的两个视图。
  document.getElementById('main').innerHTML = build(d);
}

function onOver(el, forNote) {
  const mid = el.dataset.n;
  const notes = document.querySelectorAll(`.note[data-for="${mid}"]`);
  notes.forEach((n) => n.classList.toggle('hit', forNote));
  el.classList.toggle('lit', forNote);
}

document.addEventListener('mouseover', (e) => {
  const m = e.target.closest('mark[data-n]');
  if (m) onOver(m, true);
});
document.addEventListener('mouseout', (e) => {
  const m = e.target.closest('mark[data-n]');
  if (m) onOver(m, false);
});

// 从页边注反查正文标注（编号唯一的模式下直接高亮所有同号）
document.addEventListener('mouseover', (e) => {
  const n = e.target.closest('.note[data-for]');
  if (!n) return;
  document
    .querySelectorAll(`mark[data-n="${n.dataset.for}"]`)
    .forEach((m) => m.classList.add('lit'));
});
document.addEventListener('mouseout', (e) => {
  const n = e.target.closest('.note[data-for]');
  if (!n) return;
  document
    .querySelectorAll(`mark[data-n="${n.dataset.for}"]`)
    .forEach((m) => m.classList.remove('lit'));
});

/* ── 封面：先把文本摆出来，再选改法 ───────────── */
const noteCount = (k) => DATA[k].annots.reduce((s, a) => s + a.notes.length, 0);

const PICK = {
  rig: {
    k: '严谨化',
    en: 'RIGOR',
    d: '把断言压回它证据能支撑的位置：该加条件的加条件，该降级的降级，该删的删。不改知识，只改确定性。',
    m: () => [noteCount('rig') + ' 条批注', DATA.rig.byline[3]],
  },
  pop: {
    k: '通俗化',
    en: 'PLAIN',
    d: '把机制从句子里挖出来放前面，删掉重复的情绪升级。不加解释，只做减法和重排。',
    m: () => [noteCount('pop') + ' 条批注', DATA.pop.byline[3]],
  },
};

/* 封面只露首段与收尾一句：够认出是哪一篇，又不至于把整篇摊在这里 */
const plain = (x) => x.replace(/<[^>]+>/g, '');
const firstPara = plain(ORIG.rig[0]);
const lastPara = plain(ORIG.rig[ORIG.rig.length - 1]);
const lastSent = lastPara.split(/(?<=[。！？])/).filter(Boolean).pop() || lastPara;

document.getElementById('qtext').innerHTML =
  `<span>${esc(firstPara)}</span>` +
  `<span class="gap">……</span>` +
  `<span>${esc(lastSent)}</span>`;
document.getElementById('qmeta').textContent =
  `${SRC.paras} 段 · ${SRC.chars.toLocaleString()} 字 · 两种改法都基于这一份原文，各自出稿`;
document.getElementById('qtag').textContent = '要处理的文本';

document.getElementById('pick').innerHTML = MODES.map(
  (m) => `<button type="button" data-mode="${m}">
      <span class="pk">${PICK[m].k}<i>${PICK[m].en}</i></span>
      <span class="pd">${PICK[m].d}</span>
      <span class="pm">${PICK[m].m().map((x) => `<span>${esc(x)}</span>`).join('')}</span>
    </button>`,
).join('');

function showCover() {
  document.getElementById('doc').hidden = true;
  document.getElementById('cover').hidden = false;
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
}

function choose(mode) {
  paint(mode);
  document.getElementById('cover').hidden = true;
  document.getElementById('doc').hidden = false;
  // 先收起封面再滚，否则滚动位置会被封面高度「留住」
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
}

document.getElementById('pick').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (b) choose(b.dataset.mode);
});

document.getElementById('again').addEventListener('click', showCover);
</script>
</body>
</html>
